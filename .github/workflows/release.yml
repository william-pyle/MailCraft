name: Release

# A pushed version tag vX.Y.Z promotes verified Windows x64 CI binaries and makes ONE
# GitHub release, "MailSolutions vX.Y.Z" on that tag, holding all the files plus SHA256SUMS.txt
# (`sha256sum` format) and SHA256SUMS.txt.sig (MailSolutions's own ed25519 signature over it, which
# a copy of MailSolutions checks before it takes an update): the layout of the Craft apps' releases,
# so ArtCraft Launcher and anything else that reads those releases finds MailSolutions's files by
# the same names. A signed release is published after the files pass verification. See docs/releasing.md.
#
# A tag signs only when this exact main commit has a successful trusted CI run and compatible
# immutable candidate. A matching tree or a similarly named check is not sufficient.
#
# The signing and publishing jobs run in the protected `release` environment, which holds the
# signing secrets and is limited to version tags; only a version tag reaches them. They are not the
# jobs that build: ci.yml compiles without signing credentials and hands the binaries on by
# digest, and no job with a signing secret, an Azure sign-in, a keychain or the `release`
# environment runs cargo, rustup or a built program (`cargo xtask workflows` checks it). The
# release files are checked against the digests their jobs gave before the checksums are made, and
# the checksums are signed with the runner's OpenSSL (packaging/sign-sums.sh), not a program built
# here.
#
# Run by hand (workflow_dispatch) on main to verify its existing CI candidate without
# building or packaging. Dispatch on a version tag to promote, sign and publish it,
# subject to the same main/ci-ok gate and protected release environment as a pushed tag.
#
# This workflow is self-contained on purpose. The Craft apps inside the storytold organisation
# call a shared one (storytold/craft-common-actions) that needs that organisation's runners and
# release environment; if MailSolutions's repository ever moves there, call that one instead.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "Optional successful main CI run for this exact commit; never triggers a build"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    # Read trusted CI run/job/artifact identities without granting mutation permissions.
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      build_digest: ${{ steps.seal.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # All branches, to tell whether the tagged commit is on main.
          fetch-depth: 0
      # Everything that builds or signs `needs` this job, so a tag that fails here stops the run
      # before any signing secret is in reach.
      - name: A release tag is a commit of main that passed CI
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main: a release is tagged on a commit that was reviewed and merged"
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false; then
            echo "::error::This release is already published; it will not be rebuilt or replaced"
            exit 1
          fi
      - id: v
        name: The tag is the version in Cargo.toml
        run: |
          . packaging/env.sh
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but Cargo.toml says version $VERSION: run 'cargo xtask version set', commit, and tag that commit"
            exit 1
          fi
          case "$VERSION" in *-*) pre=true ;; *) pre=false ;; esac
          { echo "version=$VERSION"; echo "prerelease=$pre"; } >>"$GITHUB_OUTPUT"

      - name: Verify trusted exact-commit CI and immutable candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_CI_RUN: ${{ inputs.ci_run_id }}
        run: ./packaging/ci/promotion.ps1 -Mode Promote -Output handoff -RunId $env:SELECTED_CI_RUN
      - name: Hand the verified candidate to packaging by digest
        id: seal
        run: |
          digest=$(bash packaging/ci/handoff.sh seal handoff build-windows-x64)
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-windows-x64
          path: handoff/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # A pushed or manually dispatched version tag: signed, in the `release` environment.
  package:
    name: Package
    needs: [version]
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/package.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      id-token: write # package.yml's Windows job signs in to Azure with OIDC
    with:
      freebsd: false
      sign: true
      build_digest: ${{ needs.version.outputs.build_digest }}
      version: ${{ needs.version.outputs.version }}
    # Only the secrets package.yml declares, by name. The signing ones live in the `release`
    # environment; package.yml's jobs that sign name that environment, and only there do they have
    # values. Those jobs build nothing: they sign what a build job without secrets handed on.
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}

  publish:
    name: Verify and publish the release
    needs: [version, package]
    # A version tag only; branch dispatches stop at verified CI candidate artifacts.
    if: "!cancelled() && needs.package.result == 'success' && startsWith(github.ref, 'refs/tags/v')"
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      # Build provenance: a signed attestation of which workflow run, at which commit, made
      # each file (`gh attestation verify <file> -R <owner>/<repo>`).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: The files are the ones their jobs made
        env:
          WINDOWS_X64: ${{ needs.package.outputs.windows_x64 }}
        run: |
          bash packaging/ci/handoff.sh check artifacts "release-windows-x64=$WINDOWS_X64"
      - name: Checksums
        working-directory: artifacts
        run: |
          rm -f SHA256SUMS.txt SHA256SUMS.txt.sig
          sha256sum -- * | tee SHA256SUMS.txt
      # MailSolutions's own release signature over the checksums (SHA256SUMS.txt.sig): what a copy of
      # MailSolutions checks before it installs an update. Made by the runner's OpenSSL 3, checked
      # against its package's file list first; nothing is compiled or downloaded in this job, and
      # no program built from this repository runs with the key. Without the key the release is
      # unsigned and says so.
      - name: Sign the checksums
        env:
          MAILSOLUTIONS_RELEASE_KEY: ${{ secrets.MAILCRAFT_RELEASE_KEY }}
        run: packaging/sign-sums.sh artifacts
      - name: Verify updater signature and every final file
        run: bash packaging/verify-sums.sh artifacts
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*
      # The same attestation as a file beside the others (SLSA provenance, in-toto), for whoever
      # checks a release without GitHub's command line. Not in SHA256SUMS.txt: it is made after it.
      - name: Provenance file
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          VERSION: ${{ needs.version.outputs.version }}
        run: cp -- "$BUNDLE" "artifacts/mailsolutions-$VERSION.intoto.jsonl"
      # Stage the release as a draft so an interrupted run can replace only unpublished files.
      # A release that is already published is never changed here.
      - name: Create the draft release, or replace the files of the draft a re-run made
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          tag="v$VERSION"
          title="MailSolutions v$VERSION"
          pre=()
          if [ "$PRERELEASE" = "true" ]; then pre=(--prerelease); fi
          # Existing historical issue references belong to the upstream tracker.
          sed 's|GITHUB_REPOSITORY|UCS-Care-Group/mailcraft|g' "$GITHUB_WORKSPACE/packaging/release-notes.md" >"$RUNNER_TEMP/notes.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::release $tag is already published; the workflow only makes and refreshes drafts"
              exit 1
            fi
            gh release view "$tag" --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset "$tag" "$asset" --yes
            done
            gh release upload "$tag" --clobber -- *
          else
            gh release create "$tag" --draft --title "$title" --target "$GITHUB_SHA" \
              --notes-file "$RUNNER_TEMP/notes.md" "${pre[@]}" -- *
          fi
          {
            echo "Staged release **$title** at \`${GITHUB_SHA::9}\`."
            echo
            sed 's/^/    /' SHA256SUMS.txt
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Publish the signed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ ! -s artifacts/SHA256SUMS.txt.sig ]; then
            echo "::error::The release has no MailSolutions signature; it remains a draft and cannot be offered for automatic updates"
            exit 1
          fi
          gh release edit "v$VERSION" --draft=false
          echo "Published MailSolutions v$VERSION with its verified release files and signature." >>"$GITHUB_STEP_SUMMARY"
