# The gates every change must pass: formatting, clippy with warnings as errors, the tests, asset
# attribution, crate layering and cargo-deny (`cargo xtask ci`), on Windows x64 only.
# Other target builds are paused at the owner's request. Changes to documentation alone don't run it, nor changes under
# .github/ alone (templates, the CodeQL set-up), save to the workflows, which `cargo xtask
# workflows` reads; `ci-ok` reports on every pull request either way, and is the check that
# protection of main requires.
name: CI

on:
  push:
    branches: [main]
    paths: ['**', '!docs/**', '!**/*.md', '!.github/**', 'ATTRIBUTION.md', '.github/workflows/**', '.github/scripts/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # A dropped connection to crates.io is tried again rather than failing the run.
  CARGO_NET_RETRY: 10

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether a pull request changes anything but documentation (Markdown files and docs/;
  # ATTRIBUTION.md counts as code, since `cargo xtask assets` reads it) and .github/ (nothing the
  # build reads; the workflows count as code, since `cargo xtask workflows` reads them).
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
      android: ${{ steps.diff.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo code=true >> "$GITHUB_OUTPUT"; echo android=true >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(git diff --name-only "$BASE"...HEAD)
          # The Android app is built and linted only when it or what it is built from changes.
          if printf '%s\n' "$files" | grep -qE '^(apps/mailsolutions-android/|crates/mobile/|crates/host/|xtask/src/mobile|\.github/workflows/ci\.yml)'; then
            echo android=true >> "$GITHUB_OUTPUT"
          else
            echo android=false >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$files" | grep -qvE '^docs/|^\.github/|\.md$|^$' || printf '%s\n' "$files" | grep -qxE 'ATTRIBUTION\.md|\.github/workflows/.*\.ya?ml'; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (no releases; pinned by hash) # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        # Pull requests read main's cache but don't write their own: a cache per PR fills the
        # repository's 10 GB and pushes out the caches that matter (FreeBSD's above all).
        with:
          # The same cache as `fragments` reads.
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # A main run whose tests fail still keeps what it compiled for the next run.
          cache-on-failure: true
      # Runs the test binaries side by side (`cargo xtask ci` uses it when it is there).
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest@0.9.150
      - run: cargo run --locked --package xtask -- ci
        env:
          XTASK_CI_SKIP: wasm,wasm-clock,deny

  # cargo-deny (deny.toml): RustSec advisories, licences, duplicate crates, sources. Its own job,
  # since it needs no build; `ci` skips the step it would otherwise run.
  deny:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

  # A pull request of documentation alone skips `ci`, but its fragments (`docs/log.d/`,
  # `packaging/release-notes.d/`) are joined at release time: they are checked here, so that one
  # that wouldn't join fails the pull request that adds it and not the release.
  fragments:
    needs: changes
    if: needs.changes.outputs.code != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (no releases; pinned by hash) # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        # `ci`'s cache (main writes it), read and never written here.
        with:
          shared-key: ci
          save-if: false
      - run: cargo run --locked --package xtask -- docs-log --check
      - run: cargo run --locked --package xtask -- release-notes > $null

  # The phone binding (`mailsolutions-mobile`) must keep building for Android: a check, no tests, with
  # the NDK the runner image provides. Its own job and not behind `changes`: a change anywhere
  # below it (the engine, the network crate, the model) can break it, so it runs on every pull
  # request, and it is cheap (a check of one target).
  android:
    if: ${{ false }} # Windows x64 builds only until the owner re-enables other targets.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (no releases; pinned by hash) # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: android
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # The NDK's clang for C code in the build scripts (ring) and as the linker, at Android 10's
      # level (API 29), the least the app supports.
      - name: cargo check for Android
        run: |
          bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$bin/aarch64-linux-android29-clang"
          export AR_aarch64_linux_android="$bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$bin/aarch64-linux-android29-clang"
          cargo check --locked --target aarch64-linux-android -p mailsolutions-mobile

  # The Android app (`apps/mailsolutions-android`): `cargo xtask mobile` builds the Rust library for
  # Android with cargo-ndk, generates the Kotlin bindings, builds the debug and release apps, runs
  # Android Lint and detekt as errors and the unit tests, checks the licences of what ships and that
  # no Play Services or Firebase is in the tree. Only when the app, the binding or the host crate
  # changes (`changes`).
  android-app:
    needs: changes
    if: ${{ false }} # Windows x64 builds only.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (no releases; pinned by hash) # zizmor: ignore[ref-version-mismatch]
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: android-app
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Android SDK pieces the app is built with
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" > /dev/null
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked --version 4.1.2
      - name: cargo xtask mobile
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"  # Paparazzi 2 runs on 21; the app still targets 17
          cargo run --locked --package xtask -- mobile

  # A cold optimized/static-CRT build is incompatible with debug test objects. Build it once,
  # alongside the gates, without signing credentials or release-environment access. Only a
  # successful main run (including ci-ok) is eligible for later promotion.
  candidate:
    name: Windows release candidate
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.repository == 'william-pyle/MailSolutions' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
      - name: Build release candidate once
        shell: pwsh
        env:
          MAILSOLUTIONS_GOOGLE_CLIENT_ID: ${{ secrets.MAILCRAFT_GOOGLE_CLIENT_ID }}
          MAILSOLUTIONS_GOOGLE_CLIENT_SECRET: ${{ secrets.MAILCRAFT_GOOGLE_CLIENT_SECRET }}
        run: |
          $env:MAILSOLUTIONS_BUILD_DATE = (git show -s --format=%cs HEAD).Trim()
          ./packaging/windows/package.ps1 -Arch x64 -BuildOnly
          ./packaging/windows/verify-programs.ps1 -Folder target/x86_64-pc-windows-msvc/release
          ./packaging/ci/promotion.ps1 -Mode Seal -Output candidate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-windows-x64-${{ github.sha }}-${{ github.run_attempt }}
          path: candidate/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  # The one check main's protection requires: passes when every platform passed, or when there
  # was nothing but documentation to check.
  ci-ok:
    needs: [changes, ci, deny, candidate, fragments, android, android-app]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
